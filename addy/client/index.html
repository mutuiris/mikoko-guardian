<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://kit.fontawesome.com/ccbd4d6bc1.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Addy Weather Monitor</title>
</head>
<body>
    <div class="weather-app">
        <div class="container">
            <h3 class="brand">Addy Weather</h3>
            <div>
                <h1 class="temp">25&#176;</h1>
                <div class="city-time">
                    <h1 class="name">Nairobi</h1>
                    <small>
                        <span class="time">14:30</span>
                        - <span class="date">Saturday 25/5/2025</span>
                    </small>
                </div>
                <div class="weather">
                    <img src="./icons/day/113.png" class="icon" alt="icon" width="50" height="50">
                    <span class="condition">Clear</span>
                </div>
            </div>
        </div>
        <div class="panel">
            <form id="locationInput">
                <input type="text" class="search" placeholder="Search Location...">
                <button type="submit" class="submit">
                    <i class="fas fa-search"></i>
                </button>
            </form>

            <ul class="cities">
                <li class="city">Mombasa</li>
                <li class="city">Nairobi</li>
                <li class="city">Kisumu</li>
                <li class="city">London</li>
            </ul>

            <ul class="details">
                <h4>Weather Details</h4>
                <li>
                    <span>Cloudy</span>
                    <span class="cloud">89%</span>
                </li>
                <li>
                    <span>Humidity</span>
                    <span class="humidity">64%</span>
                </li>
                <li>
                    <span>Wind</span>
                    <span class="wind">8km/h</span>
                </li>
            </ul>

            <!-- NEW AI INSIGHTS SECTION -->
            <div class="ai-insights" id="aiInsights">
                <h4>
                    <i class="fas fa-robot"></i> 
                    AI Weather Insights
                    <span class="ai-status" id="aiStatus">🤖</span>
                </h4>
                <div class="insights-content" id="insightsContent">
                    <p class="loading-insights">Loading AI insights...</p>
                </div>
            </div>

            <!-- NEW AI CHAT SECTION -->
            <div class="ai-chat" id="aiChat">
                <h4>
                    <i class="fas fa-comments"></i> 
                    Chat with Addy
                    <button class="chat-toggle" id="chatToggle">
                        <i class="fas fa-chevron-up"></i>
                    </button>
                </h4>
                <div class="chat-container" id="chatContainer">
                    <div class="chat-messages" id="chatMessages">
                    </div>
                    <form class="chat-input-form" id="chatForm">
                        <input type="text" class="chat-input" id="chatInput" placeholder="Ask Addy about weather..." maxlength="200">
                        <button type="submit" class="chat-send" id="chatSend">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
